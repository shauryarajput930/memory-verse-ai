[build]
  publish = ".next"
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS, HEAD"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Requested-With, User-Agent, Accept, Cache-Control"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS, HEAD"
    Access-Control-Allow-Headers = "*"
    Cache-Control = "no-store, no-cache, must-revalidate"

[[redirects]]
  from = "/health"
  to = "/api/health"
  status = 200

[[redirects]]
  from = "/api/documents/*"
  to = "https://memoryverse-ai.onrender.com/api/documents/:splat"
  status = 200

[[redirects]]
  from = "/api/timeline/*"
  to = "https://memoryverse-ai.onrender.com/api/timeline/:splat"
  status = 200

[[redirects]]
  from = "/api/search/*"
  to = "https://memoryverse-ai.onrender.com/api/search/:splat"
  status = 200
